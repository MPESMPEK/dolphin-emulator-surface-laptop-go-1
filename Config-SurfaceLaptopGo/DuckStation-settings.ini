[Main]
SettingsVersion = 2
InhibitScreensaver = true
ConfirmPowerOff = false

[Console]
Region = Auto
EnableFastBoot = true

[GPU]
Renderer = D3D12
AspectRatio = Custom
CustomAspectRatioNumerator = 3
CustomAspectRatioDenominator = 2
LinearFiltering = true
PGXPEnable = true
PGXPCulling = true
PGXPTextureCorrection = true
ShowFPS = true

[Folders]
Bios = bios
Snapshots = snaps
Savestates = sstates
MemoryCards = memcards
